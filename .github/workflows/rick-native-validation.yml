name: Rick native llm_transform validation

on:
  push:
    branches:
      - ci/validate-native-fast-path
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: helpers_root
    env:
      PYTHONPATH: ${{ github.workspace }}/helpers_root
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: helpers_root
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest PyYAML requests pandas tqdm openai boto3
      - name: Compile changed Python files
        run: |
          python -m py_compile \
            dev_scripts_helpers/llms/llm_transform.py \
            dev_scripts_helpers/llms/dockerized_llm_transform.py \
            dev_scripts_helpers/llms/test/test_llm_transform.py
      - name: Verify package import
        run: python -c "import helpers.hdbg as hdbg; print(hdbg.__file__)"
      - name: Run native focused tests
        run: |
          python -m pytest -q \
            dev_scripts_helpers/llms/test/test_llm_transform.py \
            -k 'native'
      - name: Diff check
        run: git diff --check origin/master...origin/bounty/llm-transform-native-fast-path --
